<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" fill="none">
  <defs>
    <!-- Left Incident Beam Gradient -->
    <linearGradient id="prismal-in-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="25%" stop-color="#0F172A" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#334155" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1.0" />
    </linearGradient>

    <!-- Dispersion Beam 1: Royal / Electric Blue -->
    <linearGradient id="prismal-beam-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077FF" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#93C5FD" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.0" />
    </linearGradient>

    <!-- Dispersion Beam 2: Cyan / Aquamarine / Mint Teal -->
    <linearGradient id="prismal-beam-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BFA5" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#14B8A6" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#5EEAD4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#99F6E4" stop-opacity="0.0" />
    </linearGradient>

    <!-- Dispersion Beam 3: Violet / Lilac Purple -->
    <linearGradient id="prismal-beam-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#A855F7" stop-opacity="0.85" />
      <stop offset="75%" stop-color="#C084FC" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#DDD6FE" stop-opacity="0.0" />
    </linearGradient>

    <!-- Facet Left Specular Gradient -->
    <linearGradient id="prismal-facet-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22252A" />
      <stop offset="40%" stop-color="#15171C" />
      <stop offset="100%" stop-color="#090A0D" />
    </linearGradient>

    <!-- Facet Right Gloss Gradient -->
    <linearGradient id="prismal-facet-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121316" />
      <stop offset="60%" stop-color="#050506" />
      <stop offset="100%" stop-color="#1A1C20" />
    </linearGradient>

    <!-- Glow filters for light beams -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. LEFT INCIDENT LIGHT RAY -->
  <!-- Soft widening beam coming from left edge and focusing onto the prism -->
  <polygon
    points="8,68 8,82 92,62 90,60"
    fill="url(#prismal-in-beam)"
  />
  <line
    x1="6"
    y1="75"
    x2="95"
    y2="61"
    stroke="#FFFFFF"
    stroke-width="1.8"
    stroke-linecap="round"
    opacity="0.9"
    filter="url(#soft-glow)"
  />

  <!-- 2. RIGHT DISPERSED SPECTRAL BEAMS -->
  <!-- Top Blue Beam (Angled up-right, soft fanning) -->
  <polygon
    points="137,63 139,69 232,46 230,22"
    fill="url(#prismal-beam-blue)"
    filter="url(#soft-glow)"
  />

  <!-- Middle Cyan/Teal Beam (Projecting horizontally right) -->
  <polygon
    points="140,71 143,77 232,70 232,50"
    fill="url(#prismal-beam-teal)"
    filter="url(#soft-glow)"
  />

  <!-- Bottom Purple/Violet Beam (Angled down-right, soft fanning) -->
  <polygon
    points="144,79 148,87 232,98 232,74"
    fill="url(#prismal-beam-purple)"
    filter="url(#soft-glow)"
  />

  <!-- 3. THE 3D FACETED PRISM TRIANGLE -->
  <!-- Triangle vertices: Apex (120, 22), Bottom-Left (78, 102), Bottom-Right (162, 102) -->
  <!-- Left Facet -->
  <polygon
    points="120,22 120,102 78,102"
    fill="url(#prismal-facet-left)"
  />

  <!-- Right Facet -->
  <polygon
    points="120,22 162,102 120,102"
    fill="url(#prismal-facet-right)"
  />

  <!-- Center Ridge (Crisp 3D division) -->
  <line
    x1="120"
    y1="22"
    x2="120"
    y2="102"
    stroke="#334155"
    stroke-width="0.8"
  />

  <!-- Left Apex Bevel/Highlight -->
  <line
    x1="120"
    y1="22"
    x2="78"
    y2="102"
    stroke="#475569"
    stroke-width="1.2"
    stroke-linecap="round"
    opacity="0.6"
  />
  <line
    x1="120"
    y1="22"
    x2="105"
    y2="50"
    stroke="#FFFFFF"
    stroke-width="1.5"
    stroke-linecap="round"
    opacity="0.85"
    filter="url(#soft-glow)"
  />

  <!-- 4. CENTRAL WHITE MOLAR TOOTH OUTLINE / EMBOSSED CONTOUR -->
  <!-- High precision anatomical stylized tooth positioned right in the center -->
  <path
    d="M 120,49
       C 114,47 107,46 103,50
       C 98,55 98,62 101,69
       C 103,74 105,82 107,91
       C 108,96 112,96 113,91
       C 115,84 117,76 120,73
       C 123,76 125,84 127,91
       C 128,96 132,96 133,91
       C 135,82 137,74 139,69
       C 142,62 142,55 137,50
       C 133,46 126,47 120,49 Z"
    fill="#08090C"
    stroke="#FFFFFF"
    stroke-width="3.2"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Subtle Inner Cusp Dimension -->
  <path
    d="M 112,53 C 117,55 123,55 128,53"
    fill="none"
    stroke="rgba(255, 255, 255, 0.4)"
    stroke-width="1.2"
    stroke-linecap="round"
  />

  <!-- Optical contact point where incident ray touches tooth contour -->
  <circle
    cx="101"
    cy="62"
    r="2.2"
    fill="#FFFFFF"
    filter="url(#soft-glow)"
  />
</svg>
